name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sync static files to bucket
        run: |
          gcloud storage rsync . "gs://${{ secrets.GCS_BUCKET }}" \
            --recursive --delete-unmatched-destination-objects \
            --exclude='\.git.*|.*\.md|data/.*|scripts/.*|Dockerfile|\.github/.*' \
            --cache-control="public, max-age=3600"

      - name: Publish extensionless aliases for clean URLs
        run: |
          for f in *.html; do
            [ "$f" = "index.html" ] && continue
            gcloud storage cp "$f" "gs://${{ secrets.GCS_BUCKET }}/${f%.html}" \
              --content-type=text/html --cache-control="public, max-age=3600"
          done

      - name: Invalidate CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache "${{ secrets.GCP_URL_MAP }}" --path="/*"
